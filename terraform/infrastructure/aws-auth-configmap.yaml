apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: NODES_ROLE_ARN_PLACEHOLDER
      username: system:node:{{EC2PrivateDNSName}}
      groups:
        - system:bootstrappers
        - system:nodes
    - rolearn: arn:aws:iam::518394500999:role/GitHubActionsRole
      username: github-actions
      groups:
        - system:masters
  mapUsers: |
    - userarn: arn:aws:iam::518394500999:user/Nateuser
      username: Nateuser
      groups:
        - system:masters
        - system:bootstrappers
        - system:nodes