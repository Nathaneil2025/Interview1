deploy-to-eks:
    name: Deploy to EKS with Helm
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::518394500999:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Install Helm
      run: |
        sudo snap install helm --classic
        helm version

    - name: Install AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}
        kubectl cluster-info

    - name: Deploy with Helm
      run: |
        echo "Deploying with image tag: ${{ needs.build-and-push.outputs.image_tag }}"
        helm upgrade --install flask-app ./helm/flask-app \
          --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
          --wait \
          --timeout 5m

    - name: Get LoadBalancer URL
      run: |
        echo "Waiting for LoadBalancer to be ready..."
        sleep 30
        LB_URL=$(kubectl get svc flask-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        echo "Application URL: http://$LB_URL"