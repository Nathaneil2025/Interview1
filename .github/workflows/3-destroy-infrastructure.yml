name: 3. Destroy Infrastructure

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      confirm:
        description: 'Type "destroy" to confirm infrastructure destruction'
        required: true
        default: ''

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.5.0
  CLUSTER_NAME: eks-flask-app-cluster

permissions:
  id-token: write
  contents: read

jobs:
  cleanup-kubernetes:
    name: Cleanup Kubernetes Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::518394500999:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Install Helm
      run: |
        sudo snap install helm --classic
        helm version

    - name: Configure kubectl
      continue-on-error: true
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }} || {
          echo "Cluster does not exist or cannot be accessed. Skipping Kubernetes cleanup."
          exit 0
        }

    - name: Check if cluster is accessible
      id: cluster-check
      continue-on-error: true
      run: |
        if kubectl cluster-info &> /dev/null; then
          echo "accessible=true" >> $GITHUB_OUTPUT
        else
          echo "accessible=false" >> $GITHUB_OUTPUT
          echo "Cluster is not accessible. Skipping Kubernetes cleanup."
        fi

    - name: Uninstall Helm release
      if: steps.cluster-check.outputs.accessible == 'true'
      continue-on-error: true
      run: |
        helm uninstall flask-app || echo "Helm release not found"

    - name: Delete all LoadBalancer services
      if: steps.cluster-check.outputs.accessible == 'true'
      continue-on-error: true
      run: |
        echo "Deleting all LoadBalancer services..."
        kubectl delete svc --all --grace-period=0 --force || echo "No services to delete"

    - name: Wait for LoadBalancers to be deleted
      if: steps.cluster-check.outputs.accessible == 'true'
      run: |
        echo "Waiting for LoadBalancers to be fully deleted from AWS..."
        sleep 90

    - name: Delete LoadBalancer security groups
      continue-on-error: true
      run: |
        echo "Finding and deleting LoadBalancer security groups..."
        
        # Find security groups created by Kubernetes (tagged with cluster name)
        LB_SG_IDS=$(aws ec2 describe-security-groups \
          --region ${{ env.AWS_REGION }} \
          --filters "Name=tag:kubernetes.io/cluster/${{ env.CLUSTER_NAME }},Values=owned" \
                    "Name=tag:kubernetes.io/service-name,Values=*" \
          --query 'SecurityGroups[*].GroupId' \
          --output text 2>/dev/null || echo "")
        
        if [ -n "$LB_SG_IDS" ]; then
          for SG_ID in $LB_SG_IDS; do
            echo "Deleting security group: $SG_ID"
            aws ec2 delete-security-group --group-id $SG_ID --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Failed to delete $SG_ID, may have dependencies or already deleted"
          done
        else
          echo "No LoadBalancer security groups found"
        fi

    - name: Final wait for cleanup
      run: |
        echo "Final wait to ensure all resources are cleaned up..."
        sleep 30

  scale-down-nodes:
    name: Scale Down Node Groups
    needs: cleanup-kubernetes
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::518394500999:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Check if cluster exists
      id: cluster-exists
      continue-on-error: true
      run: |
        if aws eks describe-cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} &> /dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Cluster does not exist. Skipping node group scaling."
        fi

    - name: Scale down public node group to 0
      if: steps.cluster-exists.outputs.exists == 'true'
      continue-on-error: true
      run: |
        echo "Scaling down public node group to 0..."
        aws eks update-nodegroup-config \
          --cluster-name ${{ env.CLUSTER_NAME }} \
          --nodegroup-name eks-flask-app-public-node-group \
          --scaling-config minSize=0,maxSize=0,desiredSize=0 \
          --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Public node group not found or already scaled down"

    - name: Scale down private node group to 0
      if: steps.cluster-exists.outputs.exists == 'true'
      continue-on-error: true
      run: |
        echo "Scaling down private node group to 0..."
        aws eks update-nodegroup-config \
          --cluster-name ${{ env.CLUSTER_NAME }} \
          --nodegroup-name eks-flask-app-private-node-group \
          --scaling-config minSize=0,maxSize=0,desiredSize=0 \
          --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Private node group not found or already scaled down"

    - name: Wait for nodes to terminate
      if: steps.cluster-exists.outputs.exists == 'true'
      run: |
        echo "Waiting for all nodes to terminate..."
        sleep 120

  destroy-infrastructure:
    name: Destroy Infrastructure with Terraform
    needs: scale-down-nodes
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::518394500999:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      working-directory: ./terraform/infrastructure
      run: terraform init

    - name: Terraform Destroy
      working-directory: ./terraform/infrastructure
      run: terraform destroy -auto-approve

    - name: Cleanup completed
      run: |
        echo "Infrastructure destroyed successfully"
        echo "Note: Bootstrap resources (S3 bucket and DynamoDB table) were NOT destroyed"
        echo "To destroy bootstrap, run terraform destroy in terraform/bootstrap directory manually"