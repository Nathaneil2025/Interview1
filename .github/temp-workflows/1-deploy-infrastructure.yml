name: 1. Deploy Infrastructure

on:
  workflow_dispatch:  # Manual trigger only

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.5.0

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure with Terraform
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::518394500999:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: ./terraform/infrastructure
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform/infrastructure
      run: terraform plan

    - name: Terraform Apply
      working-directory: ./terraform/infrastructure
      run: terraform apply -auto-approve

    - name: Get Terraform Outputs
      id: tf-outputs
      working-directory: ./terraform/infrastructure
      run: |
        echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
        echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
        echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
        echo "aws_region=${{ env.AWS_REGION }}" >> $GITHUB_OUTPUT

    - name: Save outputs to GitHub Variables
      run: |
        echo "Outputs saved:"
        echo "Cluster Name: ${{ steps.tf-outputs.outputs.cluster_name }}"
        echo "ECR Repository: ${{ steps.tf-outputs.outputs.ecr_repository_url }}"
        echo "Cluster Endpoint: ${{ steps.tf-outputs.outputs.cluster_endpoint }}"
        echo "Region: ${{ steps.tf-outputs.outputs.aws_region }}"

    outputs:
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}
      ecr_repository_url: ${{ steps.tf-outputs.outputs.ecr_repository_url }}
      cluster_endpoint: ${{ steps.tf-outputs.outputs.cluster_endpoint }}
      aws_region: ${{ steps.tf-outputs.outputs.aws_region }}